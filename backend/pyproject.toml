[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-chat-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the Enterprise Chat Assistant: streaming chat over Server-Sent Events."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Supriya Koora" }]
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
